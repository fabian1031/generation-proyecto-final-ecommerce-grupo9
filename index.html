<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/reset.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../styles/base.css">

    <!-- INICIO PARTE DINÁMICA -->
    <link rel="stylesheet" href="../styles/index.css">
    <title>Home</title>
    <!-- FIN PARTE DINÁMICA -->
     
</head>

<body>
    <nav class="nav-container">
    </nav>
    <div class="dinamic-container">
        <div class="main-container">
            
            <!-- INICIO PARTE DINÁMICA -->

            <!-- Hero -->
            <section class="hero-section">
                <div class="hero-content">
                    <h1 class="hero-title">Descubre nuestra colección</h1>
                    <p class="hero-subtitle">Productos seleccionados para ti</p>
                    <a href="#productos" class="btn btn-hero">Ver productos</a>
                </div>
            </section>
 
            <!-- Sección de productos -->
            <section class="filters-section container-fluid px-4 px-md-5" id="productos">
 
                <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-4">
                    <h2 class="section-title mb-0">Productos</h2>
                    <div class="filter-pills d-flex flex-wrap gap-2" id="categoryFilters">
                        <button class="filter-pill active" data-category="all">Todos</button>
                        <!-- Categorías generadas dinámicamente en home.js -->
                    </div>
                </div>
 
                <!-- Grid de tarjetas -->
                <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-4 g-4" id="productsGrid">
                    <!-- Skeleton loaders mientras carga -->
                    <div class="col skeleton-card-col"><div class="card product-card skeleton"></div></div>
                    <div class="col skeleton-card-col"><div class="card product-card skeleton"></div></div>
                    <div class="col skeleton-card-col"><div class="card product-card skeleton"></div></div>
                    <div class="col skeleton-card-col"><div class="card product-card skeleton"></div></div>
                </div>
 
                <!-- Estado vacío -->
                <div class="empty-state d-none" id="emptyState">
                    <i class="bi bi-box-seam"></i>
                    <p>No hay productos en esta categoría.</p>
                </div>
 
            </section>                
            <!-- FIN PARTE DINÁMICA -->
          
        </div>
        <footer class="footer-container">
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../scripts/base.js"></script>
    <script src="../components/navbar.js"></script>
    <script src="../components/footer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- INICIO PARTE DINÁMICA -->
    <script type="module" src="../scripts/index.js"></script>
    <!-- FIN PARTE DINÁMICA -->
</body>

</html>
