<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/reset.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../styles/base.css">

    <!-- INICIO PARTE DINÁMICA -->
    <link rel="stylesheet" href="../styles/admin_dashboard.css">
    <title>Panel de Administración</title>
    <!-- FIN PARTE DINÁMICA -->

</head>

<body>
    <nav class="nav-container">
    </nav>
    <div class="dinamic-container">
        <main class="main-container">
             <h2>Product Admin Dashboard</h2>


   <div class="container py-4" style="max-width: 640px;">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0">Productos</h5>
            <button class="btn btn-dark btn-sm" data-bs-toggle="offcanvas" data-bs-target="#offcanvasProducto">
                + Agregar
            </button>
        </div>

        <!-- Lista de productos -->
        <div class="list-group">

            <button
                class="list-group-item list-group-item-action d-flex justify-content-between align-items-start gap-2"
                data-bs-toggle="offcanvas" data-bs-target="#offcanvasProducto">
                <div class="text-start">
                    <div class="fw-semibold">Laptop Zephyrus</div>
                    <small class="text-muted">Asus ROG · Laptop Gamer</small><br>
                    <small class="text-muted">Intel Core i9 9900k RTX 4070ti</small>
                </div>
                <div class="text-end flex-shrink-0">
                    <div class="fw-semibold">$45.000.000</div>
                    <small class="text-muted">Stock: 5</small>
                </div>
            </button>

            <button
                class="list-group-item list-group-item-action d-flex justify-content-between align-items-start gap-2"
                data-bs-toggle="offcanvas" data-bs-target="#offcanvasProducto">
                <div class="text-start">
                    <div class="fw-semibold">Laptop Zephyrus</div>
                    <small class="text-muted">Asus ROG · Laptop Gamer</small><br>
                    <small class="text-muted">Intel Core i9 9900k RTX 4070ti</small>
                </div>
                <div class="text-end flex-shrink-0">
                    <div class="fw-semibold">$45.000.000</div>
                    <small class="text-muted">Stock: 5</small>
                </div>
            </button>

            <button
                class="list-group-item list-group-item-action d-flex justify-content-between align-items-start gap-2"
                data-bs-toggle="offcanvas" data-bs-target="#offcanvasProducto">
                <div class="text-start">
                    <div class="fw-semibold">Laptop Zephyrus</div>
                    <small class="text-muted">Asus ROG · Laptop Gamer</small><br>
                    <small class="text-muted">Intel Core i9 9900k RTX 4070ti</small>
                </div>
                <div class="text-end flex-shrink-0">
                    <div class="fw-semibold">$45.000.000</div>
                    <small class="text-muted">Stock: 5</small>
                </div>
            </button>

        </div>
    </div>

    <!-- Offcanvas -->
    <div class="offcanvas offcanvas-bottom rounded-top-4 h-100" tabindex="-1" id="offcanvasProducto">
        <div class="offcanvas-header border-bottom">
            <h6 class="offcanvas-title">Producto</h6>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body overflow-auto">

            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" placeholder="Nombre del producto">
            </div>

            <div class="mb-3">
                <label class="form-label">Marca</label>
                <input type="text" class="form-control" placeholder="Marca">
            </div>

            <div class="mb-3">
                <label class="form-label">Descripción</label>
                <textarea class="form-control" rows="2" placeholder="Descripción"></textarea>
            </div>

            <div class="row g-2 mb-3">
                <div class="col">
                    <label class="form-label">Precio ($)</label>
                    <input type="number" class="form-control" placeholder="0">
                </div>
                <div class="col">
                    <label class="form-label">Stock</label>
                    <input type="number" class="form-control" placeholder="0">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Categoría</label>
                <input type="text" class="form-control" placeholder="Ej: Laptop Gamer">
            </div>

            <div class="mb-4">
                <label class="form-label">Ruta de imagen</label>
                <input type="text" class="form-control" placeholder="../assets/products/img.png">
            </div>

            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary w-50" data-bs-dismiss="offcanvas">Cancelar</button>
                <button class="btn btn-dark w-50">Guardar</button>
            </div>

        </div>
    </div>
        </main>
        <footer class="footer-container">
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../scripts/base.js"></script>
    <script src="../components/navbar.js"></script>
    <script src="../components/footer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- INICIO PARTE DINÁMICA -->
    <script type="module" src="../scripts/admin_dashboard.js"></script>
    <!-- FIN PARTE DINÁMICA -->
</body>

</html>
