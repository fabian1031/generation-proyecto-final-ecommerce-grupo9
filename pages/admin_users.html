<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/reset.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../styles/base.css">

    <!-- INICIO PARTE DINÁMICA -->
    <link rel="stylesheet" href="../styles/admin_dashboard.css">
    <title>Panel de Administración</title>
    <!-- FIN PARTE DINÁMICA -->

</head>

<body>
    <nav class="nav-container">
    </nav>
    <div class="dinamic-container">
        <main class="main-container">
            <div class="container py-4" style="max-width: 640px;">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">Usuarios</h5>


                    <button class="btn btn-dark btn-sm" onclick="openCreateUser()">
                        + Agregar
                    </button>
                </div>
                <div class="d-flex gap-2 mb-3">
                    <button class="btn btn-outline-dark btn-sm" onclick="setFilter('all')">
                        Todos
                    </button>

                    <button class="btn btn-outline-success btn-sm" onclick="setFilter('active')">
                        Activos
                    </button>

                    <button class="btn btn-outline-danger btn-sm" onclick="setFilter('inactive')">
                        Inactivos
                    </button>
                </div>
                <div class="list-group" id="usersList"></div>

            </div>
            <div class="offcanvas offcanvas-bottom rounded-top-4 h-100" id="offcanvasUser">
                <div class="offcanvas-header border-bottom">
                    <h6 class="offcanvas-title" id="offcanvasTitle">Usuarios</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
                </div>

                <div class="offcanvas-body overflow-auto">

                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input id="u_username" type="text" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">LastName</label>
                        <input id="u_lastname" type="text" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Rol</label>
                        <input id="u_role" type="text" class="form-control">
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col">
                            <label class="form-label">ID</label>
                            <input id="u_id" type="text" class="form-control" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Estado</label>
                            <input id="u_active" type="text" class="form-control" readonly>
                        </div>

                        <div class="d-flex gap-2">
                            <button class="btn btn-outline-secondary w-50" data-bs-dismiss="offcanvas">
                                Cancelar
                            </button>

                            <button class="btn btn-dark w-50" onclick="saveUser()">
                                Guardar
                            </button>
                        </div>

                    </div>
                </div>
        </main>
        <footer class="footer-container">
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../scripts/base.js"></script>
     <script type="module" src="../components/navbar.js"></script>
    <script src="../components/footer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- INICIO PARTE DINÁMICA -->
    <script type="module" src="../scripts/admin_users.js"></script>
    <!-- FIN PARTE DINÁMICA -->
</body>

</html>
