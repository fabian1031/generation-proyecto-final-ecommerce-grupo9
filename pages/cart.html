<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">


    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="../styles/cart.css">

    <title>Carrito</title>
</head>

<body>

    <nav class="nav-container"></nav>

    <main class="main-content">
        <div class="container py-5">


            <div class="mb-5">
                <h6 class="text-uppercase fw-bold">Carrito de compra</h6>
                <hr>
            </div>

            <div class="row g-4">


                <div class="col-lg-8">
                    <div class="cart-items-container">

                        <!-- Item 1 -->
                        <div class="cart-item card mb-3 border-0 shadow-sm">
                            <div class="card-body p-3">
                                <div class="d-flex gap-3 align-items-start">

                                    <div class="cart-item-image flex-shrink-0">
                                        <div class="cart-img-placeholder bg-secondary rounded"></div>
                                    </div>

                                    <div class="flex-grow-1 d-flex flex-column justify-content-between">
                                        <div>
                                            <p class="small text-muted mb-1">Procesador Intel</p>

                                            <p class="fw-semibold mb-2 text-start cart-title">
                                                i7 12400F 20 núcleos <br>
                                                <small>(8 núcleos P + 12 núcleos E)</small>
                                            </p>
                                        </div>

                                        <div
                                            class="d-flex gap-2 align-items-center flex-wrap justify-content-between mt-3">

                                            <div
                                                class="action-buttons d-flex align-items-center gap-2 border rounded p-1">
                                                <button class="btn btn-sm p-1 btn-qty">-</button>
                                                <span class="px-2">1</span>
                                                <button class="btn btn-sm p-1 btn-qty">+</button>
                                            </div>

                                            <span class="fw-bold">$1.000.000</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div
                                class="cart-item-footer border-top p-2 d-flex justify-content-between align-items-center">
                                <button class="btn btn-link btn-sm text-decoration-none p-0">
                                    <i class="bi bi-heart"></i> Guardar para después
                                </button>
                                <button class="btn btn-link btn-sm text-danger text-decoration-none p-0">
                                    <i class="bi bi-trash"></i> Eliminar
                                </button>
                            </div>
                        </div>

                        <!-- Item 2 -->
                        <div class="cart-item card mb-3 border-0 shadow-sm">
                            <div class="card-body p-3">
                                <div class="d-flex gap-3 align-items-flex-start">

                                    <div class="cart-item-image flex-shrink-0">
                                        <div class="cart-img-placeholder bg-secondary rounded"></div>
                                    </div>


                                    <div class="flex-grow-1 d-flex flex-column justify-content-between">
                                        <div>
                                            <p class="small text-muted mb-1">Board Asus</p>
                                            <p class="fw-semibold mb-2 text-start" style="font-size: 0.95rem;">
                                                Prime Z690
                                            </p>
                                        </div>

                                        <div
                                            class="d-flex gap-2 align-items-center flex-wrap justify-content-between mt-3">
                                            <div
                                                class="action-buttons d-flex align-items-center gap-2 border rounded p-1">
                                                <button class="btn btn-sm p-1" style="min-width: 28px;">-</button>
                                                <span class="px-2">1</span>
                                                <button class="btn btn-sm p-1" style="min-width: 28px;">+</button>
                                            </div>
                                            <span class="fw-bold">$800.000</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div
                                class="cart-item-footer border-top p-2 d-flex justify-content-between align-items-center">
                                <button class="btn btn-link btn-sm text-decoration-none p-0">
                                    <i class="bi bi-heart"></i> Guardar para después
                                </button>
                                <button class="btn btn-link btn-sm text-danger text-decoration-none p-0">
                                    <i class="bi bi-trash"></i> Eliminar
                                </button>
                            </div>
                        </div>

                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="cart-summary card border-0 shadow-sm position-lg-sticky">

                        <div class="card-body">
                            <h6 class="text-uppercase mb-3 fw-bold">Resumen de la orden</h6>

                            <div class="d-flex justify-content-between small mb-2">
                                <span>Productos (2)</span>
                                <span>$1.800.000</span>
                            </div>

                            <div class="d-flex justify-content-between small mb-3">
                                <span>Envío</span>
                                <span class="text-success">Gratis</span>
                            </div>

                            <div class="d-flex justify-content-between small mb-3">
                                <span>IVA (19%)</span>
                                <span>$342.000</span>
                            </div>

                            <hr class="my-3">

                            <div class="d-flex justify-content-between fw-bold mb-4" style="font-size: 1.1rem;">
                                <span>Total</span>
                                <span>$2.142.000</span>
                            </div>

                            <div class="form-check mb-3 small">
                                <input class="form-check-input" type="checkbox" id="terms">
                                <label class="form-check-label" for="terms">
                                    Acepto términos y condiciones
                                </label>
                            </div>

                            <button class="btn btn-dark w-100 mb-2 py-2">
                                Continuar con la compra
                            </button>

                            <button class="btn btn-outline-dark w-100 py-2">
                                Seguir comprando
                            </button>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>


    <footer class="footer-container"></footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../components/navbar.js"></script>
    <script src="../components/footer.js"></script>

</body>

</html>
