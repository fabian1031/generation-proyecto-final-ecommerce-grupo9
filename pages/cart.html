<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../styles/reset.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />

    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="../styles/cart.css" />

    <title>Carrito</title>
</head>

<body>

    
    <nav class="nav-container"></nav>

    <div class="dinamic-container">

        <main class="main-container">
            <div class="container py-5">

                <div class="mb-5">
                    <h6 class="text-uppercase fw-bold">Carrito de compra</h6>
                    <hr>
                </div>

                <div class="row g-4">

                
                    <div class="col-lg-8">
                        <div id="cartItems" class="cart-items-container">
                            
                        </div>

                        
                        <div id="cartEmpty" class="text-center d-none mt-5">
                            <i class="bi bi-cart-x" style="font-size: 2rem;"></i>
                            <p class="mt-3">Tu carrito está vacío</p>
                        </div>
                    </div>

                    
                    <div class="col-lg-4">
                        <div class="cart-summary card border-0 shadow-sm position-lg-sticky">

                            <div class="card-body">
                                <h6 class="text-uppercase mb-3 fw-bold">Resumen de la orden</h6>

                                <div class="d-flex justify-content-between small mb-2">
                                    <span id="summary-products">Productos (0)</span>
                                    <span id="summary-price">$0</span>
                                </div>

                                <div class="d-flex justify-content-between small mb-3">
                                    <span>Envío</span>
                                    <span class="text-success">Gratis</span>
                                </div>

                                <div class="d-flex justify-content-between small mb-3">
                                    <span>IVA (19%)</span>
                                    <span id="summary-iva">$0</span>
                                </div>

                                <hr class="my-3">

                                <div class="d-flex justify-content-between fw-bold mb-4" style="font-size: 1.1rem;">
                                    <span>Total</span>
                                    <span id="summary-total">$0</span>
                                </div>

                                <div class="form-check mb-3 small">
                                    <input class="form-check-input" type="checkbox" id="terms">
                                    <label class="form-check-label" for="terms">
                                        Acepto términos y condiciones
                                    </label>
                                </div>

                                <button id="goCheckout" class="btn btn-primary w-100 mb-2 py-2">
                                    Continuar con la compra
                                </button>

                                <a href="./index.html" class="btn btn-outline-success w-100 py-2">
                                    Seguir comprando
                                </a>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </main>

        <footer class="footer-container"></footer>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../components/navbar.js"></script>
    <script src="../components/footer.js"></script>

    
    <script type="module" src="../scripts/cartBadge.js"></script>

</body>
</html>
