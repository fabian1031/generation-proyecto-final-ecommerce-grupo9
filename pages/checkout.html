<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/reset.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../styles/base.css">
    <!-- <link rel="stylesheet" href="../styles/.css"> -->
    <title>Checkout</title>
</head>

<body>
    <!-- Nav -->
    <nav class="nav-container">
    </nav>

    <!-- Content -->
    <div class="dinamic-container">
        <main class="main-container">
            <div class="container py-5">

                <div class="row g-5">
                    <div class="col-lg-7">
                        <h4 class="mb-4">Tus Datos</h4>

                        <form id="checkoutForm">

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label>Nombres</label>
                                    <input id="nombre" type="text" class="form-control" required>
                                    <div class="invalid-feedback">
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label>Apellidos</label>
                                    <input id="apellidos" type="text" class="form-control" required>
                                    <div class="invalid-feedback">
                                    </div>
                                </div>

                                <div class="col-12">
                                    <label>Celular</label>
                                    <input id="celular" type="text" class="form-control" required>
                                    <div class="invalid-feedback">
                                    </div>
                                </div>

                                <div class="col-12">
                                    <label>Email</label>
                                    <input id="correo" type="email" class="form-control" required>
                                    <div class="invalid-feedback">
                                    </div>
                                </div>

                                <div class="col-12">
                                    <label>Dirección</label>
                                    <input id="direccion" type="text" class="form-control" required>
                                    <div class="invalid-feedback">
                                    </div>
                                </div>
                            </div>

                        </form>
                    </div>

                    <div class="col-lg-5">

                        <div class="card shadow-sm border-0">
                            <div class="card-body">

                                <h5 class="mb-3">Productos</h5>

                                <div id="checkoutItems"></div>

                                <hr>

                                <div class="d-flex justify-content-between small">
                                    <span id="checkoutProducts"></span>
                                    <span id="checkoutSubtotal"></span>
                                </div>

                                <div class="d-flex justify-content-between small">
                                    <span>IVA (19%)</span>
                                    <span id="checkoutIva"></span>
                                </div>

                                <hr>

                                <div class="d-flex justify-content-between fw-bold">
                                    <span>Total</span>
                                    <span id="checkoutTotal"></span>
                                </div>

                                <div class="mt-4">
                                    <button id="confirmPurchase" class="btn btn-primary w-100 mb-2 py-2">
                                        Confirmar Compra
                                    </button>
                                </div>

                            </div>
                        </div>

                    </div>

                </div>

            </div>

        </main>

        <!-- footer -->
        <footer class="footer-container">
        </footer>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../scripts/base.js"></script>
    <script type="module" src="../components/navbar.js"></script>
    <script src="../components/footer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script type="module" src="../scripts/checkout.js"></script>
</body>

</html>
