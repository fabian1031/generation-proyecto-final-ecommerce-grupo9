<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/reset.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="../styles/contact.css">
    <title>Contacto</title>
</head>

<body>
    <nav class="nav-container">
    </nav>
    <div class="dinamic-container">
        <div class="main-container">
            <main class="main-container d-flex justify-content-center">

                <main class="container py-5 m-5">
                    <form id="contactForm" class="mx-auto p-4 border rounded shadow-sm bg-white"
                        style="max-width: 500px;" novalidate>

                        <h2 class="text-center mb-4">Formulario de Contacto</h2>



                        <div class="row mb-3">

                            <div class="col-md-6">

                                <label for="nombre" class="form-label">Nombre</label>

                                <div class="input-group">

                                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>

                                    <input type="text" class="form-control" id="nombre" name="nombre"
                                        required>

                                    <div class="invalid-feedback">Por favor ingresa tu nombre.</div>


                                </div>

                            </div>



                            <div class="col-md-6">

                                <label for="correo" class="form-label">Correo electrónico</label>

                                <div class="input-group">

                                    <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>

                                    <input type="email" class="form-control" id="correo" name="correo"
                                        required>

                                    <div class="invalid-feedback">Por favor ingresa un correo válido.
                                    </div>


                                </div>

                            </div>

                        </div>



                        <div class="mb-3">

                            <label for="celular" class="form-label">Número de celular</label>

                            <div class="input-group">

                                <span class="input-group-text"><i class="bi bi-telephone-fill"></i></span>

                                <input type="tel" class="form-control" id="celular" name="celular"
                                   pattern="[0-9+\s()-]{7,20}" required>

                                <div class="invalid-feedback">Por favor ingresa un número válido.</div>

                            </div>

                        </div>



                        <div class="mb-3">

                            <label for="mensaje" class="form-label">Mensaje</label>

                            <div class="input-group">

                                <span class="input-group-text"><i class="bi bi-chat-left-text-fill"></i></span>

                                <textarea class="form-control" id="mensaje" name="mensaje" rows="4"
                                    required></textarea>

                                <div class="invalid-feedback">Por favor escribe un mensaje.</div>

                            </div>

                        </div>



                        <div class="d-grid">

                            <button type="submit" class="btn btn-primary">

                                <i class="bi bi-send-fill me-2"></i>Enviar

                            </button>

                        </div>

                    </form>


                </main>

            </main>
        </div>
        <footer class="footer-container">
        </footer>
    </div>
    <script src="../components/navbar.js"></script>
    <script src="../components/footer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="../scripts/about.js"></script>
</body>

</html>
